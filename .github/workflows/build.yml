name: Build ORBITAL APK

on: [push, workflow_dispatch]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Init npm project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android capacitor-music-controls-plugin

      - name: Prepare web assets
        run: |
          set -e
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          cp index.html www/index.html
          cp manifest.json www/manifest.json
          cp sw.js www/sw.js
          cp icon-192.png www/icon-192.png
          cp icon-512.png www/icon-512.png

          if [ -f apple-touch-icon.png ]; then
            cp apple-touch-icon.png www/apple-touch-icon.png
          else
            echo "WARNING: apple-touch-icon.png not found"
          fi

          echo "Web assets OK"

      - name: Init Capacitor project
        run: npx cap init "ORBITAL" "com.orbital.app" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Register music controls plugin
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/orbital/app/MainActivity.java"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity not found!"
            exit 1
          fi

          if grep -q "MusicControl.MusicControl" "$MAIN_ACTIVITY"; then
            echo "Music plugin already registered"
          else
            sed -i '/^import com.getcapacitor.BridgeActivity;/a import com.selcip.capacitor.MusicControl.MusicControl;' "$MAIN_ACTIVITY"
            echo "Music plugin added"
          fi

          grep "MusicControl.MusicControl" "$MAIN_ACTIVITY" || exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
