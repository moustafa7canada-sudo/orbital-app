name: Build ORBITAL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/core @capacitor/cli
          npm install @capacitor/android

      - name: Install Music Controls Plugin
        run: npm install capacitor-music-controls-plugin@^5.0.0

      - name: Copy web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp *.png www/ 2>/dev/null || true

      - name: Init Capacitor
        run: npx cap init ORBITAL com.orbital.app --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Register Music Plugin in MainActivity
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/orbital/app/MainActivity.java"
          echo "Checking MainActivity..."
          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity not found!"
            exit 1
          fi
          if grep -q "CapacitorMusicControls" "$MAIN_ACTIVITY"; then
            echo "Plugin already registered."
          else
            sed -i '/^import com.getcapacitor.BridgeActivity;/a import com.ingageco.capacitormusiccontrols.CapacitorMusicControls;' "$MAIN_ACTIVITY"
            echo "Plugin import added."
          fi
          grep "CapacitorMusicControls" "$MAIN_ACTIVITY" || exit 1

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbital-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
